<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="description" content="Prometheus Relay 控制台登录">
  <title>登录 · Prometheus Relay</title>
  <link rel="icon" href="static/mark.svg?v=20260822-2" type="image/svg+xml">
  <link rel="stylesheet" href="static/app.css?v=20260822-2">
  <link rel="stylesheet" href="static/login.css?v=20260827-6">
  <script src="static/login.js?v=20260827-1" defer></script>
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="loginTitle">
    <header class="login-card-header">
      <a class="login-brand" href="/login" aria-label="Prometheus Relay 登录页">
        <img class="brand-mark" src="static/mark.svg?v=20260822-2" alt="">
        <span>
          <strong>Prometheus Relay</strong>
          <small>CONTROL CENTER</small>
        </span>
      </a>
      <span class="login-security"><i class="status-dot" aria-hidden="true"></i>安全连接</span>
    </header>

    <div class="login-panel-heading">
      <p class="eyebrow">控制台入口</p>
      <h1 id="loginTitle">登录控制台</h1>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <div class="field login-field">
        <div class="label-row">
          <label for="username">用户名</label>
          <span class="field-hint">控制台账号</span>
        </div>
        <div class="input-shell">
          <svg class="field-symbol user-symbol" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="6.5" r="3.25" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M4.25 17a5.75 5.75 0 0 1 11.5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          </svg>
          <input id="username" name="username" type="text" autocomplete="username" required maxlength="64" placeholder="输入用户名" autofocus>
        </div>
      </div>

      <div class="field login-field">
        <div class="label-row">
          <label for="password">密码</label>
          <span class="field-hint">区分大小写</span>
        </div>
        <div class="input-shell">
          <svg class="field-symbol lock-symbol" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="4" y="8.5" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
            <path d="M6.5 8.5V6.75a3.5 3.5 0 0 1 7 0V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            <circle cx="10" cy="12.5" r="1" fill="currentColor"></circle>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码">
          <button id="passwordToggle" class="password-toggle" type="button" aria-controls="password" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
      </div>

      <p id="loginError" class="login-error" role="alert" aria-live="assertive" hidden>
        <span class="error-mark" aria-hidden="true">!</span>
        <span id="loginErrorText"></span>
      </p>

      <button id="loginButton" class="button primary login-submit" type="submit">
        <span id="loginButtonLabel">登录</span>
        <span id="loginButtonSpinner" class="button-spinner" aria-hidden="true" hidden></span>
        <span id="loginButtonArrow" class="button-arrow" aria-hidden="true">→</span>
      </button>
    </form>

    <div class="login-help">
      <span class="help-mark" aria-hidden="true">?</span>
      <p>需要账号？请联系管理员创建客户账号。</p>
    </div>
  </main>
</body>
</html>
