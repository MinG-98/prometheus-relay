<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Douyin Fire</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: white; border-radius: 14px; padding: 20px; margin: 14px 0; box-shadow: 0 4px 20px #17202a12; }
    h1, h2 { margin-top: 0; }
    h1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { font-size: 1.1rem; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input, textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #ccd3da; border-radius: 8px; padding: 9px 10px; background: #fff; color: inherit; }
    textarea { min-height: 82px; resize: vertical; font-family: inherit; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .account { border: 1px solid #dce2e8; border-radius: 10px; padding: 14px; margin: 12px 0; }
    .account-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .cookie-upload { display: grid; gap: 6px; }
    .inline-checkbox { display: flex; align-items: center; gap: 8px; }
    .inline-checkbox input { width: auto; }
    .muted { color: #65727e; font-size: .9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; background: #1677ff; color: white; font-weight: 600; }
    button.secondary { background: #65727e; }
    button.danger { background: #d64545; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111827; color: #d1fae5; border-radius: 8px; padding: 14px; min-height: 120px; max-height: 420px; overflow: auto; }
    #message { min-height: 1.5em; margin-top: 10px; }
    .ok { color: #087f5b; } .error { color: #c92a2a; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } main { padding: 14px 10px 32px; } }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
      .card, input, textarea, select { background: #1f2937; color: #e5e7eb; border-color: #4b5563; }
      .account { border-color: #4b5563; }
      .muted { color: #a9b4c0; }
    }
  </style>
</head>
<body>
<main>
  <h1><span>Douyin Fire</span><span id="status" class="muted">加载中…</span></h1>
  <div class="card">
    <h2>任务设置</h2>
    <div class="grid">
      <div><label for="matchMode">匹配方式</label><select id="matchMode"><option value="short_id">抖音号（推荐）</option><option value="nickname">昵称</option></select></div>
      <div><label for="logLevel">日志级别</label><select id="logLevel"><option>Info</option><option>Debug</option><option>Warning</option><option>Error</option></select></div>
    </div>
    <label for="messageTemplate">消息模板</label>
    <textarea id="messageTemplate" placeholder="续火花"></textarea>
    <div class="grid">
      <div><label for="browserTimeout">浏览器超时（毫秒）</label><input id="browserTimeout" type="number" min="1000"></div>
      <div><label for="friendListTimeout">好友列表等待（毫秒）</label><input id="friendListTimeout" type="number" min="0"></div>
      <div><label for="taskRetryTimes">重试次数</label><input id="taskRetryTimes" type="number" min="1" max="10"></div>
      <div><label for="hitokotoTypes">一言类型（逗号分隔）</label><input id="hitokotoTypes" placeholder="文学,影视,诗词,哲学"></div>
    </div>
    <div class="grid">
      <div><label class="inline-checkbox"><input id="scheduleEnabled" type="checkbox">启用每日定时运行</label></div>
      <div><label for="scheduleTime">每日运行时间</label><input id="scheduleTime" type="time"></div>
      <div><label for="scheduleTimezone">定时运行时区</label><input id="scheduleTimezone" type="text" placeholder="Asia/Shanghai"></div>
    </div>
    <p class="muted">保存后由 VPS 调度器按该时区每天运行一次；关闭开关即可停用定时任务。默认北京时间 09:00，定时任务不会影响“立即运行”。</p>
  </div>

  <div class="card">
    <h2>账号</h2>
    <p class="muted">每个账号都要填写自己的抖音号、用户名和 Cookie；新增空白账号后不能直接保存。抖音号只能包含字母、数字、下划线或短横线。</p>
    <p class="muted">已保存的 Cookie 只显示数量，不会回显到网页。更换 Cookie 时重新选择 Cookie-Editor 导出的 JSON 文件或重新粘贴 JSON。</p>
    <div id="accounts"></div>
    <button id="addAccount" class="secondary">添加账号</button>
  </div>

  <div class="card">
    <h2>运行</h2>
    <div class="actions"><button id="save">保存配置</button><button id="run">立即运行</button><button id="refresh" class="secondary">刷新状态</button></div>
    <div id="message" class="muted"></div>
  </div>

  <div class="card"><h2>最近日志</h2><pre id="logs">暂无日志</pre></div>
</main>
<script>
  let state = null;
  let dirty = false;
  let preserveForm = false;
  const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
  const api = (path, options = {}) => fetch(base + path, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
  const say = (text, error = false) => { $('message').textContent = text; $('message').className = error ? 'error' : 'ok'; };

  async function responseError(response) {
    try {
      const payload = await response.json();
      if (typeof payload === 'string') return payload;
      return payload.detail || payload.message || `请求失败（HTTP ${response.status}）`;
    } catch (_) {
      return `请求失败（HTTP ${response.status}）`;
    }
  }

  function render(drafts = {}) {
    const settings = state.config.settings;
    $('matchMode').value = settings.matchMode;
    $('logLevel').value = settings.logLevel;
    $('messageTemplate').value = settings.messageTemplate;
    $('browserTimeout').value = settings.browserTimeout;
    $('friendListTimeout').value = settings.friendListTimeout;
    $('taskRetryTimes').value = settings.taskRetryTimes;
    $('hitokotoTypes').value = (settings.hitokotoTypes || []).join(',');
    const schedule = { enabled: false, time: '09:00', timezone: 'Asia/Shanghai', ...(settings.schedule || {}) };
    $('scheduleEnabled').checked = Boolean(schedule.enabled);
    $('scheduleTime').value = schedule.time;
    $('scheduleTimezone').value = schedule.timezone;
    $('accounts').innerHTML = state.config.accounts.map((account, index) => `
      <div class="account" data-index="${index}">
        <div class="account-head"><strong>账号 ${index + 1}</strong><button type="button" class="danger remove">删除</button></div>
        <div class="grid">
          <div><label>用户名</label><input class="username" value="${escapeHtml(account.username)}"></div>
          <div><label>抖音号（必填）</label><input class="unique-id" value="${escapeHtml(account.unique_id)}" placeholder="例如：abc123"></div>
        </div>
        <label class="target-label">目标好友抖音号（逗号或换行分隔）</label>
        <textarea class="targets" placeholder="每行填写一个好友抖音号">${escapeHtml((account.targets || []).join('\n'))}</textarea>
        <label>Cookie 文件（推荐）</label>
        <div class="cookie-upload">
          <input class="cookie-file" type="file" accept=".json,application/json,text/json">
          <span class="muted cookie-file-status">${account.hasCookies ? `未选择文件；留空保留已保存的 ${account.cookieCount} 条 Cookie` : '请选择 Cookie-Editor 导出的 JSON 文件（最大 2 MB）'}</span>
        </div>
        <label>Cookie JSON（也可手动粘贴）</label>
        <textarea class="cookies" placeholder="${account.hasCookies ? `已保存 ${account.cookieCount} 条 Cookie；留空则保留原值` : '请粘贴 Cookie-Editor 导出的 JSON 数组'}"></textarea>
      </div>`).join('');
    $('accounts').querySelectorAll('.remove').forEach((button) => button.addEventListener('click', (event) => {
      if (document.querySelector('[data-cookie-file-pending]')) {
        say('Cookie 文件还在读取，请稍候再删除账号', true);
        return;
      }
      const index = Number(event.target.closest('.account').dataset.index);
      const drafts = captureForm();
      drafts.accounts.splice(index, 1);
      state.config.accounts.splice(index, 1);
      dirty = true;
      render(drafts);
    }));
    bindCookieFileInputs();
    restoreFormSettings(drafts.settings);
    restoreDrafts(drafts.accounts || []);
    updateTargetLabels();
    updateStatus();
  }

  function captureForm() {
    return {
      settings: {
        matchMode: $('matchMode').value,
        logLevel: $('logLevel').value,
        messageTemplate: $('messageTemplate').value,
        browserTimeout: $('browserTimeout').value,
        friendListTimeout: $('friendListTimeout').value,
        taskRetryTimes: $('taskRetryTimes').value,
        hitokotoTypes: $('hitokotoTypes').value,
        scheduleEnabled: $('scheduleEnabled').checked,
        scheduleTime: $('scheduleTime').value,
        scheduleTimezone: $('scheduleTimezone').value,
      },
      accounts: captureDrafts(),
    };
  }

  function captureDrafts() {
    return [...document.querySelectorAll('.account')].map((element) => ({
      username: element.querySelector('.username').value,
      uniqueId: element.querySelector('.unique-id').value,
      targets: element.querySelector('.targets').value,
      cookies: element.querySelector('.cookies').value,
      cookieJson: element.dataset.cookieJson || '',
      cookieFileError: element.dataset.cookieFileError || '',
      cookieFilePending: element.dataset.cookieFilePending || '',
      cookieFileStatus: element.querySelector('.cookie-file-status')?.textContent || '',
    }));
  }

  function restoreFormSettings(draft) {
    if (!draft) return;
    $('matchMode').value = draft.matchMode;
    $('logLevel').value = draft.logLevel;
    $('messageTemplate').value = draft.messageTemplate;
    $('browserTimeout').value = draft.browserTimeout;
    $('friendListTimeout').value = draft.friendListTimeout;
    $('taskRetryTimes').value = draft.taskRetryTimes;
    $('hitokotoTypes').value = draft.hitokotoTypes;
    $('scheduleEnabled').checked = draft.scheduleEnabled;
    $('scheduleTime').value = draft.scheduleTime;
    $('scheduleTimezone').value = draft.scheduleTimezone;
  }

  function restoreDrafts(drafts) {
    drafts.forEach((draft, index) => {
      const element = document.querySelectorAll('.account')[index];
      if (!element) return;
      element.querySelector('.username').value = draft.username;
      element.querySelector('.unique-id').value = draft.uniqueId;
      element.querySelector('.targets').value = draft.targets;
      element.querySelector('.cookies').value = draft.cookies;
      if (draft.cookieJson) element.dataset.cookieJson = draft.cookieJson;
      if (draft.cookieFileError) element.dataset.cookieFileError = draft.cookieFileError;
      if (draft.cookieFilePending) element.dataset.cookieFilePending = draft.cookieFilePending;
      if (draft.cookieFileStatus) {
        const status = element.querySelector('.cookie-file-status');
        status.textContent = draft.cookieFileStatus;
        status.className = draft.cookieFileError ? 'error cookie-file-status' : 'ok cookie-file-status';
      }
    });
  }

  function updateTargetLabels() {
    const shortIdMode = $('matchMode').value === 'short_id';
    document.querySelectorAll('.target-label').forEach((label) => {
      label.textContent = shortIdMode ? '目标好友抖音号（逗号或换行分隔）' : '目标好友昵称（逗号或换行分隔）';
    });
    document.querySelectorAll('.targets').forEach((textarea) => {
      textarea.placeholder = shortIdMode ? '每行填写一个好友抖音号' : '每行填写一个好友原始昵称';
    });
  }

  function updateStatus() {
    const status = (state && state.status) || {};
    const running = Boolean(status.running);
    $('status').textContent = running ? '运行中' : `空闲${status.exitCode !== null && status.exitCode !== undefined ? ` · 上次退出 ${status.exitCode}` : ''}`;
    $('status').className = running ? 'error' : 'muted';
  }

  function bindCookieFileInputs() {
    document.querySelectorAll('.cookie-file').forEach((input) => input.addEventListener('change', async () => {
      const account = input.closest('.account');
      const status = account.querySelector('.cookie-file-status');
      const file = input.files?.[0];
      delete account.dataset.cookieJson;
      delete account.dataset.cookieFileError;
      if (!file) {
        status.textContent = '尚未选择 Cookie 文件';
        return;
      }
      dirty = true;
      if (file.size > 2 * 1024 * 1024) {
        account.dataset.cookieFileError = '文件不能超过 2 MB';
        status.textContent = '文件过大，不能超过 2 MB';
        status.className = 'error cookie-file-status';
        say('Cookie 文件过大，不能超过 2 MB', true);
        return;
      }
      account.dataset.cookieFilePending = '1';
      status.textContent = `正在读取 ${file.name}…`;
      status.className = 'muted cookie-file-status';
      try {
        const text = await file.text();
        const cookies = JSON.parse(text);
        if (!Array.isArray(cookies) || cookies.length === 0 || cookies.some((cookie) => !cookie || typeof cookie !== 'object' || Array.isArray(cookie))) {
          throw new Error('文件必须是非空 JSON 数组，且每项都是对象');
        }
        account.dataset.cookieJson = text;
        status.textContent = `已读取 ${file.name}（${cookies.length} 条 Cookie）`;
        status.className = 'ok cookie-file-status';
        say(`账号 ${Number(account.dataset.index) + 1} 的 Cookie 文件已读取，请点击保存配置`);
      } catch (error) {
        account.dataset.cookieFileError = error.message || 'Cookie 文件无效';
        status.textContent = account.dataset.cookieFileError;
        status.className = 'error cookie-file-status';
        say(`账号 ${Number(account.dataset.index) + 1}：${account.dataset.cookieFileError}`, true);
      } finally {
        delete account.dataset.cookieFilePending;
      }
    }));
  }

  function collect() {
    const accounts = [...document.querySelectorAll('.account')].map((element, index) => {
      const username = element.querySelector('.username').value.trim();
      const uniqueId = element.querySelector('.unique-id').value.trim();
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(uniqueId)) {
        throw new Error(`账号 ${index + 1}：请输入抖音号，只能包含字母、数字、下划线或短横线`);
      }
      if (!username) {
        throw new Error(`账号 ${index + 1}：请填写用户名`);
      }
      const account = {
        username,
        unique_id: uniqueId,
        targets: element.querySelector('.targets').value.split(/[\n,，]/).map((value) => value.trim()).filter(Boolean),
      };
      const cookies = element.querySelector('.cookies').value.trim();
      if (element.dataset.cookieFilePending) {
        throw new Error(`账号 ${index + 1}：Cookie 文件还在读取，请稍候再保存`);
      }
      if (element.dataset.cookieFileError) {
        throw new Error(`账号 ${index + 1}：${element.dataset.cookieFileError}`);
      }
      if (element.dataset.cookieJson) {
        if (cookies) {
          throw new Error(`账号 ${index + 1}：请只选择 Cookie 文件或手动粘贴 JSON，不要同时填写`);
        }
        account.cookies = JSON.parse(element.dataset.cookieJson);
      } else if (cookies) {
        try {
          account.cookies = JSON.parse(cookies);
        } catch (_) {
          throw new Error(`账号 ${index + 1}：Cookie 必须是有效的 JSON`);
        }
        if (!Array.isArray(account.cookies) || account.cookies.length === 0) {
          throw new Error(`账号 ${index + 1}：Cookie 必须是非空 JSON 数组`);
        }
      } else {
        const existing = state?.config?.accounts?.[index];
        if (!existing || existing.unique_id !== uniqueId || !existing.hasCookies) {
          throw new Error(`账号 ${index + 1}：请粘贴 Cookie-Editor 导出的 JSON 数组`);
        }
      }
      return account;
    });
    return { settings: {
      matchMode: $('matchMode').value,
      logLevel: $('logLevel').value,
      messageTemplate: $('messageTemplate').value,
      browserTimeout: Number($('browserTimeout').value),
      friendListTimeout: Number($('friendListTimeout').value),
      taskRetryTimes: Number($('taskRetryTimes').value),
      hitokotoTypes: $('hitokotoTypes').value.split(/[,，]/).map((value) => value.trim()).filter(Boolean),
      schedule: {
        enabled: $('scheduleEnabled').checked,
        time: $('scheduleTime').value,
        timezone: $('scheduleTimezone').value.trim(),
      },
    }, accounts };
  }

  async function refresh() {
    const response = await api('api/state');
    if (!response.ok) throw new Error(await responseError(response));
    const nextState = await response.json();
    // Do not replace an account form while the user is editing it. The old
    // behaviour made a newly added account disappear on the next poll before
    // the user had a chance to save it.
    if (!state || (!dirty && !preserveForm)) {
      state = nextState;
      render();
    } else {
      state.status = nextState.status;
      updateStatus();
    }
    const logs = await api('api/log');
    if (logs.ok) $('logs').textContent = (await logs.json()).log || '暂无日志';
  }

  document.addEventListener('input', () => { dirty = true; });
  $('matchMode').addEventListener('change', () => { dirty = true; updateTargetLabels(); });
  ['scheduleEnabled', 'scheduleTime', 'scheduleTimezone'].forEach((id) => $(id).addEventListener('change', () => { dirty = true; }));
  $('addAccount').addEventListener('click', () => {
    if (document.querySelector('[data-cookie-file-pending]')) {
      say('Cookie 文件还在读取，请稍候再添加账号', true);
      return;
    }
    const drafts = captureForm();
    state.config.accounts.push({ username: '', unique_id: '', targets: [], hasCookies: false, cookieCount: 0 });
    dirty = true;
    render(drafts);
    const account = document.querySelector('.account:last-child');
    account?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    account?.querySelector('.unique-id')?.focus();
    say(`账号 ${state.config.accounts.length} 已添加，请填写抖音号、用户名和 Cookie`);
  });
  $('refresh').addEventListener('click', () => refresh().catch((error) => say(error.message, true)));
  $('save').addEventListener('click', async () => {
    try {
      const response = await api('api/config', { method: 'POST', body: JSON.stringify(collect()) });
      if (!response.ok) throw new Error(await responseError(response));
      state.config = (await response.json()).config;
      dirty = false;
      preserveForm = true;
      document.querySelectorAll('.account').forEach((element, index) => {
        const account = state.config.accounts[index];
        const status = element.querySelector('.cookie-file-status');
        element.querySelector('.cookie-file').value = '';
        element.querySelector('.cookies').value = '';
        delete element.dataset.cookieJson;
        delete element.dataset.cookieFileError;
        delete element.dataset.cookieFilePending;
        status.textContent = account?.hasCookies
          ? `已保存 ${account.cookieCount} 条 Cookie；如需更换请重新选择文件`
          : '尚未保存 Cookie';
        status.className = account?.hasCookies ? 'muted cookie-file-status' : 'error cookie-file-status';
      });
      updateStatus();
      say('配置已保存；Cookie 内容已清除，仅保留数量');
    } catch (error) { say(error.message, true); }
  });
  $('run').addEventListener('click', async () => {
    try {
      if (dirty) throw new Error('请先保存配置，再立即运行');
      const response = await api('api/run', { method: 'POST' });
      if (!response.ok) throw new Error(await responseError(response));
      say('任务已启动'); await refresh();
    } catch (error) { say(error.message, true); }
  });
  refresh().catch((error) => say(error.message, true));
  setInterval(() => refresh().catch(() => {}), 5000);
</script>
</body>
</html>
