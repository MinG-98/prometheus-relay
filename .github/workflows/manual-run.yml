name: Prometheus Relay Manual Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check Douyin accessibility
        run: curl --fail --head --retry 2 https://creator.douyin.com/
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install Chromium
        run: playwright install chromium --with-deps --only-shell
      - name: Load repository configuration
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py
      - name: Run Prometheus Relay
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: prometheus-relay-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
