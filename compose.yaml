services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prometheus-relay:local
    env_file:
      - ${PROMETHEUS_RELAY_ENV_FILE:-.env}
    environment:
      PYTHONUNBUFFERED: "1"
      PROMETHEUS_RELAY_DATA_DIR: /app/data
    init: true
    ipc: host
    user: appuser
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_relay_data:/app/data
      - prometheus_relay_logs:/app/logs
    ports:
      - "127.0.0.1:18081:8000"
    command: ["uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    image: prometheus-relay:local
    env_file:
      - ${PROMETHEUS_RELAY_ENV_FILE:-.env}
    environment:
      PYTHONUNBUFFERED: "1"
      PROMETHEUS_RELAY_DATA_DIR: /app/data
    init: true
    ipc: host
    user: appuser
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_relay_data:/app/data
      - prometheus_relay_logs:/app/logs
    command: ["python", "-m", "webapp.task_runner"]
    restart: "no"

  scheduler:
    image: prometheus-relay:local
    env_file:
      - ${PROMETHEUS_RELAY_ENV_FILE:-.env}
    environment:
      PYTHONUNBUFFERED: "1"
      PROMETHEUS_RELAY_DATA_DIR: /app/data
    init: true
    ipc: host
    user: appuser
    security_opt:
      - no-new-privileges:true
    volumes:
      - prometheus_relay_data:/app/data
      - prometheus_relay_logs:/app/logs
    command: ["python", "-m", "webapp.scheduler"]
    restart: unless-stopped

volumes:
  prometheus_relay_data:
    name: ${PROMETHEUS_RELAY_DATA_VOLUME:-prometheus-relay-data}
  prometheus_relay_logs:
    name: ${PROMETHEUS_RELAY_LOGS_VOLUME:-prometheus-relay-logs}
